<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <meta
      name="description"
      content="NFT preview card component showcasing the Equilibrium #3429 digital artwork, promoting balance and calm. A modern responsive UI challenge from Frontend Mentor."
    />
    <meta
      name="keywords"
      content="NFT, preview card, frontend mentor, UI component, web design, HTML, CSS, responsive design, crypto artwork, ethereum"
    />
    <meta name="author" content="Ruben de Man" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | NFT preview card component</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <article class="preview-card" aria-label="NFT preview card">
        <div class="preview-card__cover">
          <img
            class="preview-card__cover-image"
            src="./images/image-equilibrium.jpg"
            alt="Equilibrium #3429 NFT artwork"
          />
          <a href="#" class="preview-card__cover-overlay" aria-label="View NFT">
            <img
              class="preview-card__cover-icon"
              src="./images/icon-view.svg"
              alt=""
            />
          </a>
        </div>
        <div class="preview-card__content">
          <div class="preview-card__top">
            <h1 class="preview-card__title">
              <a href="#" class="preview-card__link">Equilibrium #3429</a>
            </h1>
            <p class="preview-card__text">
              Our Equilibrium collection promotes balance and calm.
            </p>
          </div>
          <div class="preview-card__info">
            <div
              class="preview-card__info-item preview-card__info-item--highlight"
            >
              <img src="./images/icon-ethereum.svg" alt="" /> 0.041 ETH
            </div>
            <div class="preview-card__info-item">
              <img src="./images/icon-clock.svg" alt="" /> 3 days left
            </div>
          </div>
        </div>
        <footer class="preview-card__footer">
          <img
            class="preview-card__avatar"
            src="./images/image-avatar.png"
            alt="Jules Wyvern avatar"
          />
          <span
            >Creation of
            <a href="#" class="preview-card__link">Jules Wyvern</a></span
          >
        </footer>
      </article>
    </main>

    <!-- Equilibrium #3429

  Our Equilibrium collection promotes balance and calm.

  0.041 ETH
  3 days left
  
  Creation of Jules Wyvern -->

    <footer class="attribution">
      <p class="attribution__text">
        Challenge by
        <a
          class="attribution__link"
          href="https://www.frontendmentor.io?ref=challenge"
          target="_blank"
          rel="noopener noreferrer"
          >Frontend Mentor</a
        >. Coded by
        <a
          class="attribution__link"
          href="https://rubendeman.nl"
          target="_blank"
          rel="noopener noreferrer"
          >Ruben de Man</a
        >.
      </p>
    </footer>
  </body>
</html>
